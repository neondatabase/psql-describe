name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on:
      group: databricks-ghec-untrusted-runner-group
      labels: linux-ubuntu-latest-untrusted-2core-8gb

    steps:
      # setup
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Check container runtime
        run: podman info 2>/dev/null || docker info

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: lts/*

      - name: Setup JFrog CLI with OIDC
        uses: jfrog/setup-jfrog-cli@279b1f629f43dd5bc658d8361ac4802a7ef8d2d5 # v4.9.1
        env:
          JF_URL: https://databricks.jfrog.io
        with:
          oidc-provider-name: github-actions

      - name: Install package dependencies
        run: |
          jf npmc --repo-resolve=db-npm
          jf npm clean-install

      # pcpp, the C preprocessor that xslt/preprocess.py uses, in a venv whose python3 comes first on the PATH for
      # later steps (the translation also needs git and perl, which the runner has)
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          source .venv/bin/activate
          jf pipc --repo-resolve=db-pypi
          jf pip install -r xslt/requirements.txt

      # goal: fetch Postgres, translate, check the committed output is what that gives, and test
      - name: Translate and run all tests
        run: npm run end-to-end
